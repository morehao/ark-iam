server:
  name: gateway
  port: 8100
  env: dev

db:
  auto_migrate: true
  seed: true

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    service: gateway
    module: default
    level: info
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  gorm:
    service: gateway
    module: gorm
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  redis:
    service: gateway
    module: redis
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID

trace:
  enable: true
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  - url: "postgres://postgres:123456@127.0.0.1:5432/iam?sslmode=disable&TimeZone=Asia/Shanghai"
    service: iam

redis_config:
  service: iam
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

security:
  login:
    maxFailures: 5
    windowSec: 300
    lockSec: 900

jwt:
  signKey: "your-jwt-secret-key"

oidc:
  issuer: "http://localhost:8100/oidc"
  frontendLoginURL: "http://localhost:4000/login"
  signingKeyID: "dev-oidc-key"
  signingPrivateKeyPath: "config/oidc-dev-key.pem"
  signingPrivateKeyPEM: ""
  encryptionKey: "oidc-dev-encryption-key-32bytes"
  encryptionKeyID: "dev-enc-key"
  allowInsecure: true
  authRequestTTL: 600
  authCodeTTL: 300
  spentCodeTTL: 86400
  sessionTTL: 86400
  # SSO 会话 cookie：开发环境 http 不启用 Secure；生产（HTTPS）必须 cookieSecure: true，
  # 跨站 SSO 场景 cookieSameSite: none（且必须配合 cookieSecure: true）。
  cookieSecure: false
  cookieSameSite: lax
  # gateway 聚合部署：platform/tenant 均在 gateway 进程内，共享同一认证 Redis，
  # 开启请求粒度 SSO 活性校验以实现"一处登出、处处登出"即时性。
  enableSSOSessionValidation: true
