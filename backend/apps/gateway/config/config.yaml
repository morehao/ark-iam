server:
  name: gateway
  port: 8100
  env: dev

db:
  auto_migrate: true

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    service: gateway
    module: default
    level: info
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  gorm:
    service: gateway
    module: gorm
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  redis:
    service: gateway
    module: redis
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID

trace:
  enable: true
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


# 首次初始化（引导）配置。
# bootstrapToken 是 `POST /install/initialize` 的门禁令牌，等价于"创建平台管理员"的权限。
# 环境变量 BOOTSTRAP_TOKEN 优先于本字段（生产建议只用环境变量/密钥管理，别入库）；
# 这里是本地开发用的回落值，初始化完成后应从本文件与运行环境中一并移除。
install:
  bootstrapToken: "dev-bootstrap-token"

db_configs:
  - url: "postgres://postgres:123456@127.0.0.1:5432/iam?sslmode=disable&TimeZone=Asia/Shanghai"
    service: iam

redis_config:
  service: iam
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

security:
  login:
    maxFailures: 5
    windowSec: 300
    lockSec: 900

jwt:
  signKey: "your-jwt-secret-key"

oidc:
  # 本地联调：RustFS 容器用 host 网络（见 docker-compose），容器内的 localhost 就是宿主机，
  # 因此 issuer 用 loopback 即可两端同时可达；浏览器侧也只走 loopback（不受代理/私网 IP 影响），
  # 且 SSO 会话 cookie 与 localhost:4000 的登录页同源（免重复登录）。
  # 配套的 RustFS 出站白名单见 docker-compose 的 RUSTFS_OUTBOUND_ALLOW_ORIGINS。
  issuer: "http://localhost:8100/oidc"
  frontendLoginURL: "http://localhost:4000/login"
  # 内置控制台的部署地址（完整 URL，不做 origin 派生）：/install 页面回显"稍后从哪登录"，
  # L1 引导把同样的值写进 application_client 回调白名单，因此"页面看到的"与"落库的"必然一致。
  # 整段留空即取内置缺省值（本地开发端口 4001/4002，与历史硬编码值逐字节相同）。
  # backChannelLogoutURI 留空：按 issuer + 标准路径派生（分体部署下控制台与 issuer 不同源时才需显式配置）。
  consoles:
    platformAdminWeb:
      redirectURIs:
        - "http://localhost:4001/auth/callback"
      postLogoutRedirectURIs:
        - "http://localhost:4001/login"
    tenantAdminWeb:
      redirectURIs:
        - "http://localhost:4002/auth/callback"
      postLogoutRedirectURIs:
        - "http://localhost:4002/login"
  signingKeyID: "dev-oidc-key"
  signingPrivateKeyPath: "config/oidc-dev-key.pem"
  signingPrivateKeyPEM: ""
  encryptionKey: "oidc-dev-encryption-key-32bytes"
  encryptionKeyID: "dev-enc-key"
  allowInsecure: true
  authRequestTTL: 600
  authCodeTTL: 300
  spentCodeTTL: 86400
  sessionTTL: 86400
  # SSO 会话 cookie：开发环境 http 不启用 Secure；生产（HTTPS）必须 cookieSecure: true，
  # 跨站 SSO 场景 cookieSameSite: none（且必须配合 cookieSecure: true）。
  cookieSecure: false
  cookieSameSite: lax
  # gateway 聚合部署：platform/tenant 均在 gateway 进程内，共享同一认证 Redis，
  # 开启请求粒度 SSO 活性校验以实现"一处登出、处处登出"即时性。
  enableSSOSessionValidation: true
  # aud 白名单是 **per-app** 的：gateway 聚合了 rpapi，必须为它声明与
  # apps/rpapi/config/config.yaml 相同的白名单，否则 /v1/rp/directory/* 在
  # gateway 下会跳过 aud 收紧（platformadmin/tenantadmin 的 aud 在代码里按内置 client 常量收紧）。
  audiences:
    - "rpapi"
  # 说明：不需要（也不应）配置 jwksURL/issuer 供本进程内的内置应用自取公钥——
  # gateway.Init 会把 auth 的 OP 已发布公钥作为进程内 KeySource 注入
  # platformadmin/tenantadmin/rpapi，零网络调用。
