server:
  name: auth
  port: 8081
  env: dev

db:
  auto_migrate: true
  seed: true

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    service: auth
    module: default
    level: info
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  gorm:
    service: auth
    module: gorm
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  redis:
    service: auth
    module: redis
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID

trace:
  enable: true
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  - url: "postgres://postgres:123456@127.0.0.1:5432/iam?sslmode=disable&TimeZone=Asia/Shanghai"
    service: iam

redis_config:
  service: iam
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

security:
  login:
    maxFailures: 5
    windowSec: 300
    lockSec: 900
    # 登录/注册/改密码接口的 IP 频率限流参数（ratePerMinute=每分钟令牌数, burst=突发容量）
    ratePerMinute: 30
    burst: 10

# 生产环境注意：
#   - 以下密钥/口令均为开发用值，生产必须通过环境变量/密钥管理注入，禁止复用本文件值；
#   - 非 dev 环境启动会强制校验：cookieSecure=true、allowInsecure=false、签名/加密密钥已配置。
jwt:
  # 已废弃（token 统一为 OIDC RS256），仅保留结构兼容，可安全移除
  signKey: ""

oidc:
  issuer: "http://localhost:8081/oidc"
  frontendLoginURL: "http://localhost:3000/login"
  signingKeyID: "dev-oidc-key"
  # 开发签名私钥（仓库内 dev 密钥，仅 dev 使用；生产必须换成独立私钥并外部化）
  signingPrivateKeyPath: "config/oidc-dev-key.pem"
  signingPrivateKeyPEM: ""
  encryptionKey: "oidc-dev-encryption-key-32bytes"
  encryptionKeyID: "dev-enc-key"
  allowInsecure: true
  authRequestTTL: 600
  authCodeTTL: 300
  spentCodeTTL: 86400
  sessionTTL: 86400
  # SSO 会话 cookie：开发环境 http 不启用 Secure；生产（HTTPS）必须 cookieSecure: true，
  # 跨站 SSO 场景 cookieSameSite: none（且必须配合 cookieSecure: true）。
  cookieSecure: false
  cookieSameSite: lax
