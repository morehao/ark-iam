server:
  name: iam
  port: 8099
  env: dev

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    service: iam
    module: default
    level: info
    writer: file
    dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  gorm:
    service: iam
    module: gorm
    level: debug
    writer: file
    dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  redis:
    service: iam
    module: redis
    level: debug
    writer: file
    dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID

trace:
  enable: true
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s


db_configs:
  - url: "mysql://root:123456@127.0.0.1:3306/iam?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=3s&writeTimeout=3s"
    service: iam

redis_config:
  service: iam
  addr: 127.0.0.1:6379
  password: 123456
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

jwt:
  signKey: "your-jwt-secret-key"
