<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSO 测试应用</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5; color: #333; line-height: 1.6; min-height: 100vh;
  display: flex; justify-content: center; padding: 40px 16px;
}
.container { max-width: 800px; width: 100%; }
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
.card {
  background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 32px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border: none; border-radius: 6px;
  font-size: 15px; cursor: pointer; transition: background .2s;
}
.btn-primary { background: #1677ff; color: #fff; }
.btn-primary:hover { background: #4096ff; }
.btn-primary:disabled { background: #a0c4ff; cursor: not-allowed; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #73d13d; }
.loading { text-align: center; padding: 40px 0; color: #999; }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #1677ff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
.step:last-child { border-bottom: none; }
.step-num {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.step-num.pending { background: #f5f5f5; color: #999; }
.step-num.active { background: #e6f4ff; color: #1677ff; }
.step-num.done { background: #f6ffed; color: #52c41a; }
.step-body { flex: 1; }
.step-body .label { font-weight: 500; font-size: 14px; }
.step-body .desc { font-size: 12px; color: #999; margin-top: 2px; }
.step-body .value { font-size: 13px; margin-top: 6px; word-break: break-all; }
pre { background: #f6f8fa; border-radius: 4px; padding: 12px; font-size: 12px; overflow-x: auto; margin-top: 8px; }
code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
.token-grid { display: grid; gap: 8px; }
.token-item { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 12px; }
.token-item .key { font-size: 12px; color: #666; margin-bottom: 4px; }
.token-item .val { font-size: 12px; word-break: break-all; font-family: monospace; }
.btn-group { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn-sm { padding: 6px 16px; font-size: 13px; border-radius: 4px; }
.error { color: #ff4d4f; background: #fff2f0; border: 1px solid #ffccc7; border-radius: 6px; padding: 12px; margin-top: 12px; font-size: 13px; }
.empty-state { text-align: center; padding: 40px 0; }
.empty-state p { color: #666; margin-top: 12px; }
.home-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: #1677ff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 600; flex-shrink: 0; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { padding: 16px; background: #f6f8fa; border-radius: 8px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; }
.stat-card .stat-label { font-size: 12px; color: #666; margin-top: 2px; }
.home-actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <h1>🔐 SSO 测试应用</h1>
  <p class="subtitle">基于 OIDC 授权码流程 + PKCE，使用 IAM 作为身份提供者</p>

  <div id="content" class="card">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top:12px">处理中...</p>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  issuer: 'http://localhost:8099/v1/iam/oidc',
  clientId: 'test-rp-client',
  clientSecret: 'my-test-client-secret',
  redirectUri: window.location.origin + '/',
  scope: 'openid profile email offline_access',
}

let currentTokens = null
window.currentTokens = null

function escapeHtml(str) {
  const div = document.createElement('div')
  div.appendChild(document.createTextNode(str))
  return div.innerHTML
}

function switchToApp(appNum) {
  const targetPort = appNum === 2 ? '3002' : '3001'
  window.open('http://localhost:' + targetPort, '_blank')
}

function showTokenDetails() {
  renderResult(currentTokens, true)
}

async function sha256(buffer) {
  return crypto.subtle.digest('SHA-256', buffer)
}

function base64URLEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

function randomState() {
  const bytes = new Uint8Array(16)
  crypto.getRandomValues(bytes)
  return base64URLEncode(bytes)
}

async function generateCodeVerifier() {
  const bytes = new Uint8Array(32)
  crypto.getRandomValues(bytes)
  return base64URLEncode(bytes)
}

async function generateCodeChallenge(verifier) {
  const encoder = new TextEncoder()
  const hash = await sha256(encoder.encode(verifier))
  return base64URLEncode(hash)
}

function decodeJWT(token) {
  try {
    const parts = token.split('.')
    if (parts.length !== 3) return { error: '不是有效的 JWT 格式' }
    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')))
    const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')))
    const expDate = payload.exp ? new Date(payload.exp * 1000).toLocaleString() : '-'
    const iatDate = payload.iat ? new Date(payload.iat * 1000).toLocaleString() : '-'
    return { header, payload, expDate, iatDate }
  } catch (e) {
    return { error: e.message }
  }
}

function logoutLocal() {
  currentTokens = null
  window.currentTokens = null
  sessionStorage.removeItem('oidc_verifier')
  sessionStorage.removeItem('oidc_state')
  history.replaceState({}, '', '/')
  renderLogin()
}

// 全局退出：重定向到 IAM end_session
function logoutGlobal() {
  if (!currentTokens || !currentTokens.id_token) {
    logoutLocal()
    return
  }
  const params = new URLSearchParams({
    id_token_hint: currentTokens.id_token,
    post_logout_redirect_uri: CONFIG.redirectUri,
  })
  currentTokens = null
  window.currentTokens = null
  sessionStorage.removeItem('oidc_verifier')
  sessionStorage.removeItem('oidc_state')
  window.location.href = CONFIG.issuer + '/end_session?' + params.toString()
}

function renderLogin() {
  const el = document.getElementById('content')
  el.innerHTML = `
    <div class="empty-state">
      <div style="font-size:48px;margin-bottom:16px">🔄</div>
      <h2 style="font-size:18px;margin-bottom:8px">您尚未登录此应用</h2>
      <p>点击下方按钮，通过 IAM 身份提供者登录</p>
      <div style="margin-top:24px">
        <button class="btn btn-primary" onclick="login()" id="loginBtn">
          使用 IAM 登录
        </button>
      </div>
      <div style="margin-top:16px;font-size:12px;color:#999">
        将重定向到 IAM 的 OIDC 授权端点 → 登录页面 → 回调至此
      </div>
    </div>
  `
}

function setLoading() {
  document.getElementById('loading').style.display = 'block'
}

async function login() {
  const btn = document.getElementById('loginBtn')
  btn.disabled = true
  btn.textContent = '跳转中...'

  const verifier = await generateCodeVerifier()
  const challenge = await generateCodeChallenge(verifier)
  const state = randomState()

  sessionStorage.setItem('oidc_verifier', verifier)
  sessionStorage.setItem('oidc_state', state)

  const params = new URLSearchParams({
    response_type: 'code',
    client_id: CONFIG.clientId,
    redirect_uri: CONFIG.redirectUri,
    scope: CONFIG.scope,
    state: state,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  })

  window.location.href = CONFIG.issuer + '/authorize?' + params.toString()
}

function showError(message, detail) {
  const el = document.getElementById('content')
  el.innerHTML = `
    <div class="error">${message}</div>
    ${detail ? `<pre>${detail}</pre>` : ''}
    <div style="margin-top:16px">
      <button class="btn btn-primary" onclick="location.href='/'">重新开始</button>
    </div>
  `
}

function renderHomePage(tokens) {
  const idTokenDecoded = tokens.id_token ? decodeJWT(tokens.id_token) : null
  const payload = idTokenDecoded && !idTokenDecoded.error ? idTokenDecoded.payload : {}
  const name = escapeHtml(payload.name || payload.preferred_username || 'User')
  const email = escapeHtml(payload.email || '-')
  const avatarChar = escapeHtml(name.charAt(0))

  const el = document.getElementById('content')
  el.innerHTML = `
    <div class="home-header">
      <div class="avatar">${avatarChar}</div>
      <div>
        <div style="font-weight:600;font-size:16px">${name}</div>
        <div style="font-size:13px;color:#666;margin-top:2px">${email}</div>
        <div style="font-size:12px;color:#52c41a;margin-top:4px">✅ 已通过 IAM SSO 登录</div>
      </div>
    </div>

    <h2>项目管理面板</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">12</div>
        <div class="stat-label">项目数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">48</div>
        <div class="stat-label">任务数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">3</div>
        <div class="stat-label">消息数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">2</div>
        <div class="stat-label">团队数</div>
      </div>
    </div>

    <div class="home-actions">
      <button class="btn btn-sm" style="background:#f5f5f5;color:#333" onclick="switchToApp(2)">
        🔁 前往 SSO 测试应用 2
      </button>
      <button class="btn btn-primary btn-sm" onclick="showTokenDetails()">
        🔑 查看 Token 详情
      </button>
      <button class="btn btn-sm" style="background:#f5f5f5;color:#333" onclick="logoutLocal()">
        🚪 退出当前应用
      </button>
      <button class="btn btn-sm" style="background:#ff4d4f;color:#fff" onclick="logoutGlobal()">
        🔐 从所有应用退出
      </button>
    </div>
  `
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search)
  const code = params.get('code')
  const state = params.get('state')
  const error = params.get('error')

  if (error) {
    showError(`授权失败: ${error}`, params.get('error_description') || '')
    return
  }

  const savedState = sessionStorage.getItem('oidc_state')
  if (state && savedState && state !== savedState) {
    showError('state 不匹配，可能存在 CSRF 攻击')
    return
  }

  sessionStorage.removeItem('oidc_state')

  const verifier = sessionStorage.getItem('oidc_verifier')
  sessionStorage.removeItem('oidc_verifier')

  if (!code) {
    showError('未获取到授权码')
    return
  }

  const el = document.getElementById('content')
  el.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">正在交换授权码...</p></div>'

  let tokens
  try {
    tokens = await exchangeCode(code, verifier)
  } catch (e) {
    showError('令牌交换失败', e.message)
    return
  }

  currentTokens = tokens
  window.currentTokens = tokens
  renderHomePage(tokens)
}

async function exchangeCode(code, verifier) {
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: CONFIG.redirectUri,
    code_verifier: verifier,
  })

  const basicAuth = btoa(CONFIG.clientId + ':' + CONFIG.clientSecret)
  const resp = await fetch(CONFIG.issuer + '/oauth/token', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'Authorization': 'Basic ' + basicAuth,
    },
    body: body.toString(),
  })

  if (!resp.ok) {
    const text = await resp.text()
    throw new Error(`HTTP ${resp.status}: ${text}`)
  }

  return resp.json()
}

async function fetchUserInfo(accessToken) {
  const resp = await fetch(CONFIG.issuer + '/userinfo', {
    headers: { 'Authorization': 'Bearer ' + accessToken },
  })
  if (!resp.ok) {
    const text = await resp.text()
    throw new Error(`HTTP ${resp.status}: ${text}`)
  }
  return resp.json()
}

async function doRefresh() {
  const el = document.getElementById('refreshResult')
  if (el) el.innerHTML = '<span style="color:#999">刷新中...</span>'

  try {
    const body = new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: currentTokens.refresh_token,
    })
    const basicAuth = btoa(CONFIG.clientId + ':' + CONFIG.clientSecret)
    const resp = await fetch(CONFIG.issuer + '/oauth/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Authorization': 'Basic ' + basicAuth,
      },
      body: body.toString(),
    })
    if (!resp.ok) {
      const text = await resp.text()
      throw new Error(`HTTP ${resp.status}: ${text}`)
    }
    const tokens = await resp.json()
    currentTokens = tokens
    window.currentTokens = tokens
    if (el) el.innerHTML = '<span style="color:#52c41a">✅ 刷新成功</span>'
    renderResult(tokens, true)
  } catch (e) {
    if (el) el.innerHTML = `<span style="color:#ff4d4f">❌ 失败: ${e.message}</span>`
  }
}

async function doFetchUserInfo() {
  const el = document.getElementById('userinfoResult')
  if (el) el.innerHTML = '<span style="color:#999">获取中...</span>'
  try {
    const info = await fetchUserInfo(currentTokens.access_token)
    if (el) el.innerHTML = '<span style="color:#52c41a">✅ 获取成功</span>'
    const infoEl = document.getElementById('userinfoData')
    if (infoEl) infoEl.innerHTML = '<pre>' + JSON.stringify(info, null, 2) + '</pre>'
  } catch (e) {
    if (el) el.innerHTML = `<span style="color:#ff4d4f">❌ 失败: ${e.message}</span>`
  }
}

function renderResult(tokens, fromHome) {
  const idTokenDecoded = tokens.id_token ? decodeJWT(tokens.id_token) : null
  const accessTokenDecoded = tokens.access_token ? decodeJWT(tokens.access_token) : null

  const el = document.getElementById('content')
  el.innerHTML = `
    <div style="margin-bottom:20px">
      <span style="font-size:20px">✅</span>
      <span style="font-size:18px;font-weight:600;margin-left:8px">OIDC 登录成功</span>
      <div style="font-size:13px;color:#666;margin-top:4px">
        已通过 IAM 身份提供者完成 SSO 登录
      </div>
    </div>

    <h2>🪜 流程步骤</h2>
    <div class="step">
      <div class="step-num done">✓</div>
      <div class="step-body">
        <div class="label">发起授权请求</div>
        <div class="desc">重定向到 IAM OIDC 授权端点</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num done">✓</div>
      <div class="step-body">
        <div class="label">用户认证</div>
        <div class="desc">通过 IAM 登录页面完成身份验证</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num done">✓</div>
      <div class="step-body">
        <div class="label">获取授权码</div>
        <div class="desc">浏览器重定向回本应用，携带 authorization code</div>
        <div class="value"><code>code: ${tokens.code ? tokens.code.substring(0, 20) + '...' : '(已交换)'}</code></div>
      </div>
    </div>
    <div class="step">
      <div class="step-num done">✓</div>
      <div class="step-body">
        <div class="label">令牌交换</div>
        <div class="desc">用 code + client_secret + code_verifier 换取令牌</div>
      </div>
    </div>

    <h2 style="margin-top:24px">🔑 令牌信息</h2>
    <div class="token-grid">
      <div class="token-item">
        <div class="key">access_token</div>
        <div class="val">${tokens.access_token ? tokens.access_token.substring(0, 50) + '...' : '-'}</div>
      </div>
      <div class="token-item">
        <div class="key">id_token</div>
        <div class="val">${tokens.id_token ? tokens.id_token.substring(0, 50) + '...' : '-'}</div>
      </div>
      <div class="token-item">
        <div class="key">refresh_token</div>
        <div class="val">${tokens.refresh_token || '-'}</div>
      </div>
      <div class="token-item">
        <div class="key">token_type</div>
        <div class="val">${tokens.token_type || '-'}</div>
      </div>
      <div class="token-item">
        <div class="key">expires_in</div>
        <div class="val">${tokens.expires_in ? tokens.expires_in + ' 秒' : '-'}</div>
      </div>
    </div>

    ${idTokenDecoded && !idTokenDecoded.error ? `
    <h2 style="margin-top:24px">🪪 ID Token (解码)</h2>
    <div class="token-item">
      <div class="key">Header</div>
      <div class="val"><pre>${JSON.stringify(idTokenDecoded.header, null, 2)}</pre></div>
    </div>
    <div class="token-item" style="margin-top:8px">
      <div class="key">Payload</div>
      <div class="val"><pre>${JSON.stringify(idTokenDecoded.payload, null, 2)}</pre></div>
    </div>
    <div class="token-item" style="margin-top:8px">
      <div class="key">签发时间</div>
      <div class="val">${idTokenDecoded.iatDate}</div>
    </div>
    <div class="token-item" style="margin-top:8px">
      <div class="key">过期时间</div>
      <div class="val">${idTokenDecoded.expDate}</div>
    </div>
    ` : ''}

    ${accessTokenDecoded && !accessTokenDecoded.error ? `
    <h2 style="margin-top:24px">🔑 Access Token (解码)</h2>
    <div class="token-item">
      <div class="key">Payload</div>
      <div class="val"><pre>${JSON.stringify(accessTokenDecoded.payload, null, 2)}</pre></div>
    </div>
    <div class="token-item" style="margin-top:8px">
      <div class="key">过期时间</div>
      <div class="val">${accessTokenDecoded.expDate}</div>
    </div>
    ` : ''}

    <h2 style="margin-top:24px">📋 UserInfo</h2>
    <div id="userinfoData" class="token-item">
      <div class="val" style="color:#999">点击下方按钮获取</div>
    </div>
    <div id="userinfoResult" style="margin-top:8px"></div>

    <h2 style="margin-top:24px">🔄 操作</h2>
    <div class="btn-group">
      <button class="btn btn-success btn-sm" onclick="doFetchUserInfo()">
        📋 获取 UserInfo
      </button>
      <button class="btn btn-primary btn-sm" onclick="doRefresh()">
        🔄 刷新 Token
      </button>
      <button class="btn btn-sm" style="background:#f5f5f5;color:#333" onclick="location.href='/'">
        🔁 重新开始
      </button>
    </div>
    <div id="refreshResult" style="margin-top:8px"></div>

    <h2 style="margin-top:24px">📖 原始返回</h2>
    <pre>${JSON.stringify(tokens, null, 2)}</pre>
    ${fromHome ? `
    <div class="home-actions">
      <button class="btn btn-primary btn-sm" onclick="renderHomePage(currentTokens)">
        🏠 返回主页
      </button>
    </div>
    ` : ''}
  `
}

const params = new URLSearchParams(window.location.search)
if (params.has('code') || params.has('error')) {
  handleCallback()
} else {
  document.getElementById('loading').style.display = 'none'
  renderLogin()
}
</script>
</body>
</html>
