server:
  name: platformadmin
  port: 8082
  env: dev

db:
  auto_migrate: true

client:
  httpbingo:
    host: https://httpbingo.org
    module: httpbingo
    retry: 3
    timeout: 5s

log:
  default:
    service: platformadmin
    module: default
    level: info
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  gorm:
    service: platformadmin
    module: gorm
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID
  redis:
    service: platformadmin
    module: redis
    level: debug
    logger_type: zap
    writers:
      - type: console
      - type: file
        dir: ../../../log
    enable_otel_trace: true
    extra_keys:
      - requestID

trace:
  enable: true
  service_version: ""
  sampler: traceidratio
  trace_id_ratio: 1.0
  otlp:
    endpoint: "127.0.0.1:4317"
    insecure: true
    timeout: 10s

db_configs:
  - url: "postgres://postgres:123456@127.0.0.1:5432/iam?sslmode=disable&TimeZone=Asia/Shanghai"
    service: iam

redis_config:
  service: iam
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

security:
  login:
    maxFailures: 5
    windowSec: 300
    lockSec: 900

jwt:
  signKey: "your-jwt-secret-key"

oidc:
  issuer: "http://localhost:8081/oidc"
  frontendLoginURL: "http://localhost:4000/login"
  signingKeyID: "dev-oidc-key"
  signingPrivateKeyPath: "config/oidc-dev-key.pem"
  signingPrivateKeyPEM: ""
  encryptionKey: "oidc-dev-encryption-key-32bytes"
  encryptionKeyID: "dev-enc-key"
  allowInsecure: true
  authRequestTTL: 600
  authCodeTTL: 300
  spentCodeTTL: 86400
  sessionTTL: 86400
  enableSSOSessionValidation: true
  backChannelLogoutPath: "/bc-logout/platform"

# 临时凭据投递（邮件/短信）通道。出厂默认关闭：false = 保持现状（响应回显明文、零外部调用）。
# 运维验证通道可用后应置 enabled=true 并把 requireDelivery 按安全口径设为 true（目标默认），
# 此后响应不再回显明文。敏感字段优先从环境变量读（NOTIFY_MAIL_PASSWORD /
# NOTIFY_SMS_ACCESS_KEY_SECRET），配置仅作回落。见 docs/design/configuration-reference.md。
notify:
  enabled: false
  requireDelivery: true
  mail:
    enabled: false
    host: smtp.example.com
    port: 587
    username: ""
    password: ""        # 生产用 NOTIFY_MAIL_PASSWORD 环境变量，勿提交明文
    from: "IAM <no-reply@example.com>"
    tls: true
  sms:
    enabled: false
    provider: ""        # tencent | 空=不启用（可插拔，见 pkg/notify/sms.go）
    accessKeyID: ""
    accessKeySecret: "" # 生产用 NOTIFY_SMS_ACCESS_KEY_SECRET 环境变量
    signName: ""
    templateCode: ""
    region: ap-guangzhou
